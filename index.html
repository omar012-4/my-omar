<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohamed | Ad Designer</title>
    <!-- خط القاهرة من جوجل -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Cairo", sans-serif;
      }

      body {
        background-color: #1e1e2f;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .card {
        background: #2d2d44;
        border: 2px solid #3f3f5f;
        border-radius: 16px;
        padding: 30px 20px;
        max-width: 380px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      }

      h1 {
        color: #ffffff;
        font-size: 26px;
        margin-bottom: 8px;
      }

      .badge {
        display: inline-block;
        background-color: #ff6b00;
        color: #ffffff;
        font-size: 14px;
        font-weight: bold;
        padding: 4px 12px;
        border-radius: 12px;
        margin-bottom: 15px;
      }

      p {
        color: #c5c5d8;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 25px;
      }

      .btn {
        display: inline-block;
        background: linear-gradient(
          45deg,
          #f09433,
          #e6683c,
          #dc2743,
          #cc2366,
          #bc1888
        );
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        padding: 12px 20px;
        border-radius: 10px;
        transition: opacity 0.2s ease;
      }

      .btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>محمد</h1>
      <div class="badge">مصمم إعلانات</div>
      <p>
        تصاميم إعلانية إبداعية تعزز حضور علامتك التجارية وتجذب عملاءك
        المستهدفين.
      </p>
      <a href="https://instagram.com/osha7965" target="_blank" class="btn">
        تابعني على إنستجرام @osha7965
      </a>
    </div>
  </body>
</html>
